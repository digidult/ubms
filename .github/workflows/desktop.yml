name: Desktop

# Builds the desktop app with its installers on every relevant push, and is reused by the release
# workflow (release.yml) for a tag. Windows: NSIS setup, MSI and a portable exe. Linux: deb, rpm
# and AppImage. macOS: a universal (Apple silicon and Intel) dmg. The builds are not code signed.

on:
  push:
    branches: [main, 'desktop/**']
    paths:
      - 'apps/desktop/**'
      - 'apps/web/**'
      - 'packages/**'
      - 'scripts/make-icons.mjs'
      - 'scripts/collect-desktop.mjs'
      - '.github/workflows/desktop.yml'
  pull_request:
    paths:
      - 'apps/desktop/**'
      - 'packages/transport/**'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Git ref to build (a release tag)
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: ubms-desktop-windows
            targets: ''
            args: ''
          - os: ubuntu-22.04
            artifact: ubms-desktop-linux
            targets: ''
            args: ''
          - os: macos-latest
            artifact: ubms-desktop-macos
            targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Linux system libraries (WebKitGTK, D-Bus for BlueZ, udev for serial ports, AppImage and rpm tools)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev libudev-dev pkg-config xdg-utils libfuse2 rpm

      - run: npm ci

      - name: Build the web app (embedded into the desktop binary)
        run: npm run build

      - name: Rust unit tests
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml

      - name: Build the desktop app and its installers
        run: npm run tauri -w @ubms/desktop -- build ${{ matrix.args }}

      - name: Collect the installers
        run: node scripts/collect-desktop.mjs desktop-out

      - name: Upload the installers
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: desktop-out/*
          if-no-files-found: error
