name: Desktop

on:
  push:
    branches: [main, 'desktop/**']
    paths:
      - 'apps/desktop/**'
      - 'apps/web/**'
      - 'packages/**'
      - 'scripts/make-icons.mjs'
      - '.github/workflows/desktop.yml'
  pull_request:
    paths:
      - 'apps/desktop/**'
      - 'packages/transport/**'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:
    inputs:
      macos:
        description: Also build on macOS (macOS runners may be unavailable or costly for private repositories)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: ubms-desktop-windows
            binary: apps/desktop/src-tauri/target/release/ubms-desktop.exe
          - os: ubuntu-22.04
            artifact: ubms-desktop-linux
            binary: apps/desktop/src-tauri/target/release/ubms-desktop
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Linux system libraries (WebKitGTK, D-Bus for BlueZ, udev for serial ports)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev libudev-dev pkg-config

      - run: npm ci

      - name: Build the web app (embedded into the desktop binary)
        run: npm run build

      - name: Rust unit tests
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml

      - name: Build the desktop app
        run: npm run tauri -w @ubms/desktop -- build --no-bundle

      - name: Upload the binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.binary }}
          if-no-files-found: error

  build-macos:
    if: github.event_name == 'workflow_dispatch' && inputs.macos
    runs-on: macos-latest
    env:
      ARTIFACT: ubms-desktop-macos
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Linux system libraries (WebKitGTK, D-Bus for BlueZ, udev for serial ports)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev libudev-dev pkg-config

      - run: npm ci

      - name: Build the web app (embedded into the desktop binary)
        run: npm run build

      - name: Rust unit tests
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml

      - name: Build the desktop app
        run: npm run tauri -w @ubms/desktop -- build --no-bundle

      - name: Upload the binary
        uses: actions/upload-artifact@v4
        with:
          name: ubms-desktop-macos
          path: apps/desktop/src-tauri/target/release/ubms-desktop
          if-no-files-found: error
