name: Android

# Builds the Android app (apps/android): a Trusted Web Activity that opens the deployed web app
# in Chrome without browser UI. Reused by the release workflow (release.yml) for a tag.
# The apk is signed with the release key from the repository secrets; without them (forks, pull
# requests) it is signed with a debug key and only meant for a try. See docs/android.md.

on:
  push:
    branches: [main, 'android/**']
    paths:
      - 'apps/android/**'
      - 'apps/web/public/.well-known/**'
      - 'package.json'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'apps/android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Git ref to build (a release tag)
        type: string
        required: false
        default: ''
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: false
      ANDROID_KEYSTORE_PASSWORD:
        required: false
      ANDROID_KEY_ALIAS:
        required: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Signing key from the repository secrets
        id: key
        shell: bash
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/ubms-release.p12"
            echo "file=$RUNNER_TEMP/ubms-release.p12" >> "$GITHUB_OUTPUT"
            echo "Release key found."
          else
            echo "::warning::No signing key in the secrets: the apk is signed with a debug key."
          fi

      - name: Build the apk
        working-directory: apps/android
        env:
          ANDROID_KEYSTORE_FILE: ${{ steps.key.outputs.file }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: gradle --no-daemon assembleRelease

      - name: Check the signature against assetlinks.json
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          mkdir -p android-out
          cp apps/android/app/build/outputs/apk/release/app-release.apk "android-out/ubms_${version}_android.apk"
          apksigner="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          "$apksigner" verify --print-certs "android-out/ubms_${version}_android.apk" | tee certs.txt
          signed="$(grep -m1 'SHA-256 digest' certs.txt | sed 's/.*: //' | tr 'a-f' 'A-F')"
          wanted="$(node -p "require('./apps/web/public/.well-known/assetlinks.json')[0].target.sha256_cert_fingerprints[0].replace(/:/g, '')")"
          echo "apk:        $signed"
          echo "assetlinks: $wanted"
          if [ -n "${{ steps.key.outputs.file }}" ] && [ "$signed" != "$wanted" ]; then
            echo "::error::The apk is not signed with the key listed in assetlinks.json"
            exit 1
          fi
          rm -f "$RUNNER_TEMP/ubms-release.p12"

      - name: Upload the apk
        uses: actions/upload-artifact@v4
        with:
          name: ubms-android
          path: android-out/*.apk
          if-no-files-found: error
