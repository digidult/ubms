[package]
name = "ubms-desktop"
version = "0.1.0"
description = "ubms desktop app: the ubms web UI with native Bluetooth and serial ports"
edition = "2021"
license = "MIT"
rust-version = "1.77"
publish = false

[lib]
# The _lib suffix avoids a name clash with the binary on Windows (cargo issue 8519).
name = "ubms_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
btleplug = "0.13"
serialport = "4"
tokio = { version = "1", features = ["macros", "sync", "time", "rt"] }
futures = "0.3"
uuid = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
